<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A procedural splat meadow at golden hour, waving in the wind" />
    <title>grass</title>
    <style>
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: linear-gradient(#d9b98c, #f1d7ad 55%, #6e7a3a);
        transition: opacity 0.8s ease;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        font: 13px/1 system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        transition: opacity 1.2s ease;
      }
      #hint.hidden {
        opacity: 0;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading"></div>
    <div id="hint">WASD to walk · shift to run · drag to look</div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
