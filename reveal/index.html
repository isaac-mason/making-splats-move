<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline rather than public/favicon.svg like the other examples, because this
         one's publicDir is wind/'s (see vite.config.ts) — and /favicon.svg there is
         wind's leaf. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='52' font-size='84' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A Gaussian-splat city assembling itself out of a single point as it finishes loading."
    />
    <title>reveal</title>
    <!-- Inlined so the overlay is styled on first paint, before the bundle loads. -->
    <style>
      body {
        margin: 0;
        background: #59b3f4;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 45%, #7cc6f8 0%, #59b3f4 70%);
        font: 12px/1 ui-monospace, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(12, 40, 66, 0.7);
        transition: opacity 0.35s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading .bar {
        width: 220px;
        height: 2px;
        border-radius: 2px;
        background: rgba(12, 40, 66, 0.18);
        overflow: hidden;
      }
      #loading .bar-fill {
        width: 0%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #ffffff, #d9efff);
        transition: width 0.25s ease, opacity 0.4s ease;
      }
      /* A slow pulse, so a stalled download still looks alive. */
      #loading .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ffffff;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.6);
          opacity: 0.35;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .dot {
          animation-duration: 4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status" aria-live="polite">
      <div class="dot" aria-hidden="true"></div>
      <div class="bar" aria-hidden="true"><div class="bar-fill"></div></div>
      <div class="label">0%</div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
