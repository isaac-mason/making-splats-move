# Each example is its own standalone Vite app in a top-level directory.
packages:
    - 'fire'
    - 'wind'
    - 'dust'
    - 'avatars'
    - 'avatars-parts'
    - 'reveal'
    - 'grass'
    - 'clouds'
    - 'hair'
    - 'birds'
    - 'tree'
    - 'fireworks'
    - 'confetti'
    - 'snowglobe'
    - 'time'
    - 'rain'
    - 'ocean'

# The renderer, Radix (https://sparkjs.dev/radix/), from npm. To move to a newer
# release, change the version here and run `pnpm install`.
catalog:
    '@sparkjsdev/radix': ^0.0.1
