<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A captured school courtyard relit through a whole day: sun, shadows, dusk and moonlight" />
    <title>time</title>
    <style>
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: linear-gradient(#1d2a55, #6a4a6a 60%, #d9875a);
        transition: opacity 0.8s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #clock {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        width: min(480px, calc(100% - 32px));
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(12, 14, 22, 0.42);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: rgba(255, 248, 238, 0.92);
        font: 500 14px/1 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      #play {
        flex: none;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 248, 238, 0.14);
        cursor: pointer;
        position: relative;
      }
      /* Two bars while it plays; a triangle while paused. */
      #play::before,
      #play::after {
        content: '';
        position: absolute;
        top: 9px;
        width: 3px;
        height: 10px;
        border-radius: 1px;
        background: rgba(255, 248, 238, 0.92);
      }
      #play::before {
        left: 10px;
      }
      #play::after {
        left: 15px;
      }
      #play.paused::before {
        left: 11px;
        width: 0;
        height: 0;
        border-radius: 0;
        background: none;
        border-style: solid;
        border-width: 6px 0 6px 9px;
        border-color: transparent transparent transparent rgba(255, 248, 238, 0.92);
        top: 8px;
      }
      #play.paused::after {
        display: none;
      }
      #hour {
        flex: 1;
        min-width: 0;
        accent-color: #f3b768;
        cursor: pointer;
      }
      #time {
        flex: none;
        width: 44px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading"></div>
    <div id="clock">
      <button id="play" type="button" aria-label="Pause"></button>
      <input id="hour" type="range" min="0" max="24" step="0.01" value="16.4" aria-label="Time of day" />
      <span id="time">16:24</span>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
